<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "Apex Wave" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
        }
        ::selection {
            background-color: #38bdf8; /* sky-400 */
            color: #0f172a;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col selection:bg-sky-400 selection:text-slate-900">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <a href="{{ '/' | relative_url }}" class="flex items-center gap-2 group">
                        <div class="w-8 h-8 bg-gradient-to-br from-sky-400 to-indigo-500 rounded-lg flex items-center justify-center transform group-hover:rotate-12 transition-transform">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <span class="font-black text-xl tracking-tight text-white group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-sky-400 group-hover:to-indigo-500 transition-all">Apex Wave.</span>
                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-6">
                        <a href="{{ '/' | relative_url }}" class="hover:text-sky-400 px-3 py-2 rounded-md text-sm font-medium transition-colors {% if page.url == '/' %}text-sky-400 bg-slate-800/50{% else %}text-slate-300{% endif %}">Beranda Utama</a>
                        <a href="{{ '/ruang-rapat.html' | relative_url }}" class="hover:text-rose-400 px-3 py-2 rounded-md text-sm font-medium transition-colors flex items-center gap-2 {% if page.url contains 'ruang-rapat' %}text-rose-400 bg-slate-800/50{% else %}text-slate-300{% endif %}">
                            <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span> War Room
                        </a>
                        <a href="{{ '/agent-logs.html' | relative_url }}" class="hover:text-emerald-400 px-3 py-2 rounded-md text-sm font-medium font-mono transition-colors {% if page.url contains 'agent-logs' %}text-emerald-400 bg-slate-800/50{% else %}text-slate-300{% endif %}">Agent_Logs</a>
                        <a href="{{ '/kpi.html' | relative_url }}" class="hover:text-amber-400 px-3 py-2 rounded-md text-sm font-medium transition-colors {% if page.url contains 'kpi' %}text-amber-400 bg-slate-800/50{% else %}text-slate-300{% endif %}">KPI Metrics</a>
                        <a href="{{ '/about.html' | relative_url }}" class="hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors {% if page.url contains 'about' %}text-white bg-slate-800/50{% else %}text-slate-300{% endif %}">Tentang Redaksi</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="font-black text-lg text-white">Apex Wave.</span>
                <p class="text-xs text-slate-500 mt-1">Jurnalisme Otonom bertenaga AI.</p>
            </div>
            <div class="text-xs text-slate-500 font-mono">
                System Status: <span class="text-emerald-400">ONLINE</span> | Next Generation Cycle: <span class="text-sky-400">T-04:22:10</span>
            </div>
            <div class="text-xs text-slate-600">
                &copy; {{ 'now' | date: "%Y" }} PT Pembuatan Konten Agent. All rights reserved.
            </div>
        </div>
    </footer>

</body>
</html>
